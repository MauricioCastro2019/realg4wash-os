name: Mi Auto Pro smoke

on:
  push:
    branches:
      - agent/mi-auto-pro-preview
  pull_request:
    paths:
      - 'app/garage/**'
      - 'app/templates/garage/**'
      - 'tests/test_mi_auto_pro_memory.py'
      - 'requirements.txt'
      - '.github/workflows/mi-auto-pro-smoke.yml'

jobs:
  memory-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mi_auto_pro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d mi_auto_pro_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Smoke test · SQLite
        run: python -m unittest tests.test_mi_auto_pro_memory -v
      - name: Reset PostgreSQL test database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d mi_auto_pro_test -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'
      - name: Smoke test · PostgreSQL / pg8000
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mi_auto_pro_test
        run: python -m unittest tests.test_mi_auto_pro_memory -v
